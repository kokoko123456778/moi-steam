name: Build Мои игры (APK)

# Один файл на весь проект: при каждой сборке он сам создаёт все файлы Android-приложения
# (манифест, gradle, код на Java, интерфейс в виде HTML) и собирает подписанный APK.
# Готовый APK берётся из Releases (вкладка справа в репозитории) или из Actions -> запуск -> Artifacts.
# Подпись у всех сборок одна и та же, поэтому новую версию можно ставить поверх старой.
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Create project files
        run: |
          mkdir -p app/src/main/java/com/mygames/launcher app/src/main/res/xml app/src/main/assets

          cat > settings.gradle <<'SETTINGS_EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "MyGames"
          include ':app'
          SETTINGS_EOF

          cat > build.gradle <<'ROOT_EOF'
          plugins {
              id 'com.android.application' version '8.2.2' apply false
          }
          ROOT_EOF

          cat > gradle.properties <<'PROPS_EOF'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2g
          PROPS_EOF

          base64 -d > app/launcher.keystore <<'KEYSTORE_EOF'
          
          KEYSTORE_EOF

          cat > app/build.gradle <<'APP_EOF'
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.mygames.launcher'
              compileSdk 34
              defaultConfig {
                  applicationId 'com.mygames.launcher'
                  minSdk 21
                  targetSdk 34
                  versionCode 2
                  versionName '2.0'
              }
              signingConfigs {
                  mygames {
                      storeFile file('launcher.keystore')
                      storePassword 'mygames123'
                      keyAlias 'mygames'
                      keyPassword 'mygames123'
                  }
              }
              buildTypes {
                  debug {
                      signingConfig signingConfigs.mygames
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          dependencies {
              implementation 'androidx.core:core:1.12.0'
          }
          APP_EOF

          cat > app/src/main/AndroidManifest.xml <<'MANIFEST_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />
              <uses-permission android:name="android.permission.REQUEST_DELETE_PACKAGES" />
              <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES" />
              <application
                  android:label="Мой Steam"
                  android:allowBackup="true"
                  android:usesCleartextTraffic="true"
                  android:theme="@android:style/Theme.Material.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <provider
                      android:name="androidx.core.content.FileProvider"
                      android:authorities="com.mygames.launcher.fileprovider"
                      android:exported="false"
                      android:grantUriPermissions="true">
                      <meta-data
                          android:name="android.support.FILE_PROVIDER_PATHS"
                          android:resource="@xml/file_paths" />
                  </provider>
              </application>
          </manifest>
          MANIFEST_EOF

          cat > app/src/main/res/xml/file_paths.xml <<'PATHS_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <paths>
              <external-files-path name="apk" path="apk/" />
          </paths>
          PATHS_EOF

          cat > app/src/main/assets/index.html <<'HTML_EOF'
          <!DOCTYPE html>
          <html lang="ru">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
          <title>Мой Steam</title>
          <style>
          :root{
            --bg:#171a21; --bar:#1b2838; --panel:#16202d; --card:#1f2d3f; --line:#2c3e55;
            --txt:#c7d5e0; --mut:#8f98a0; --acc:#66c0f4; --green:#4c9a2a; --green2:#5ba32b; --red:#c0392b; --yel:#e8c53a;
          }
          @media (prefers-color-scheme: light){ :root[data-theme="auto"]{} }
          :root[data-theme="dark"]{}
          *{box-sizing:border-box}
          html,body{margin:0;padding:0;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-text-size-adjust:100%}
          body{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
          a{color:var(--acc)}
          header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bar);border-bottom:1px solid var(--line)}
          .top{display:flex;align-items:center;gap:10px;padding:10px 14px}
          .logo{font-weight:800;letter-spacing:.5px;color:#fff;font-size:18px;white-space:nowrap}
          .logo span{color:var(--acc)}
          nav{display:flex;gap:2px;overflow-x:auto;padding:0 8px 8px;scrollbar-width:none}
          nav::-webkit-scrollbar{display:none}
          nav button{flex:0 0 auto;background:transparent;color:var(--mut);border:0;padding:9px 14px;border-radius:6px 6px 0 0;font-size:14px;font-weight:700;cursor:pointer;border-bottom:2px solid transparent}
          nav button.on{color:#fff;border-bottom-color:var(--acc);background:rgba(102,192,244,.08)}
          main{max-width:1100px;margin:0 auto;padding:14px}
          h2{margin:6px 0 12px;font-size:20px;color:#fff}
          .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
          .card{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;cursor:pointer;transition:transform .12s,border-color .12s}
          .card:hover{transform:translateY(-2px);border-color:var(--acc)}
          .card .art{height:140px}
          .card .body{padding:12px 14px}
          .card h3{margin:0 0 4px;color:#fff;font-size:17px}
