          var BUILD_T = {"cpp": "name: build-apk\n\n# Создано «Игротекой». Собирает APK игры (C++ и SDL2) и публикует его в Releases.\non:\n  push:\n    branches: [ main, master ]\n  workflow_dispatch:\n\npermissions:\n  contents: write\n\nenv:\n  APP_ID: __APP_ID__\n  APP_LABEL: __APP_NAME__\n  APK_NAME: Game.apk\n  JNI_NAME: game\n\nconcurrency:\n  group: build-apk\n  cancel-in-progress: true\n\njobs:\n  build-apk:\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v4\n        with:\n          repository: libsdl-org/SDL\n          ref: SDL2\n          path: SDL\n\n      - uses: actions/checkout@v4\n        with:\n          path: game\n          fetch-depth: 0\n\n      - name: Prepare SDL android project\n        run: |\n          cd SDL/android-project\n          ln -sfn ../../../ app/jni/SDL\n          ls -la app/jni/SDL\n          # берём тот файл .cpp, который загружали последним (по времени коммита), номер в имени не важен\n          BEST=0; SRC=\"\"\n          for f in ../../game/*.cpp; do\n            T=$(git -C ../../game log -1 --format=%ct -- \"$(basename \"$f\")\")\n            if [ \"${T:-0}\" -ge \"$BEST\" ]; then BEST=${T:-0}; SRC=\"$f\"; fi\n          done\n          echo \"Файл игры: $SRC\"\n          cp \"$SRC\" app/jni/src/$JNI_NAME.cpp\n          # заголовки SDL лежат в SDL/include/SDL.h, а игра подключает \u003cSDL2/SDL.h>: приводим к одному виду\n          sed -i 's#\u003cSDL2/#\u003c#g' app/jni/src/$JNI_NAME.cpp\n          sed -i \"s/LOCAL_SRC_FILES := YourSourceHere.c/LOCAL_SRC_FILES := $JNI_NAME.cpp/\" app/jni/src/Android.mk\n          sed -i '/LOCAL_SRC_FILES/a LOCAL_CPPFLAGS := -std=c++14 -Wno-narrowing -fexceptions' app/jni/src/Android.mk\n          # игре нужны исключения C++ (try/catch), в NDK они по умолчанию выключены\n          sed -i '/LOCAL_CPPFLAGS/a LOCAL_CPP_FEATURES := exceptions rtti' app/jni/src/Android.mk\n          printf 'APP_STL := c++_shared\\nAPP_PLATFORM := android-21\\n' > app/jni/Application.mk\n          MANIFEST=app/src/main/AndroidManifest.xml\n          sed -i 's#\u003capplication#\u003cuses-permission android:name=\"android.permission.INTERNET\" />\\n    \u003cuses-permission android:name=\"android.permission.ACCESS_WIFI_STATE\" />\\n    \u003cuses-permission android:name=\"android.permission.ACCESS_NETWORK_STATE\" />\\n\\n    \u003capplication#' \"$MANIFEST\"\n          sed -i 's#\u003cactivity #\u003cactivity android:screenOrientation=\"__ORIENT__\" #' \"$MANIFEST\"\n          # своё имя и свой идентификатор приложения, чтобы игры не затирали друг друга на телефоне\n          sed -i -E \"s#applicationId ['\\\"]org\\.libsdl\\.app['\\\"]#applicationId \\\"$APP_ID\\\"#\" app/build.gradle\n          # в шаблоне SDL нет applicationId (он берётся из namespace org.libsdl.app, и все игры получались одним приложением): задаём свой\n          grep -q applicationId app/build.gradle || sed -i \"0,/defaultConfig {/s//defaultConfig {\\n        applicationId \\\"$APP_ID\\\"/\" app/build.gradle\n          sed -i -E \"s#(\u003cstring name=\\\"app_name\\\">)[^\u003c]*(\u003c/string>)#\\1$APP_LABEL\\2#\" app/src/main/res/values/strings.xml\n          # рисовать на весь экран, в том числе под вырезом камеры (иначе справа остаётся чёрная полоса)\n          ACT=app/src/main/java/org/libsdl/app/SDLActivity.java\n          [ -f \"$ACT\" ] && sed -i '0,/super.onCreate(savedInstanceState);/s//super.onCreate(savedInstanceState);\\n        if (android.os.Build.VERSION.SDK_INT >= 28) { getWindow().getAttributes().layoutInDisplayCutoutMode = 1; }/' \"$ACT\"\n          grep -n \"layoutInDisplayCutoutMode\" \"$ACT\" || echo \"cutout patch NOT applied\"\n          # тема с «заходом» под вырез камеры (в ландшафте иначе справа остаётся чёрная полоса)\n          mkdir -p app/src/main/res/values\n          cat > app/src/main/res/values/cutout.xml \u003c\u003c'XEOF'\n          \u003c?xml version=\"1.0\" encoding=\"utf-8\"?>\n          \u003cresources>\n            \u003cstyle name=\"GameTheme\" parent=\"@android:style/Theme.NoTitleBar.Fullscreen\">\n              \u003citem name=\"android:windowLayoutInDisplayCutoutMode\">shortEdges\u003c/item>\n            \u003c/style>\n          \u003c/resources>\n          XEOF\n          sed -i -E 's#android:theme=\"[^\"]*\"#android:theme=\"@style/GameTheme\"#' \"$MANIFEST\"\n          grep -n \"android:theme\" \"$MANIFEST\" || echo \"ТЕМА НЕ НАЙДЕНА В МАНИФЕСТЕ\"\n          echo \"----- Android.mk -----\"; cat app/jni/src/Android.mk\n          echo \"----- Application.mk -----\"; cat app/jni/Application.mk\n          echo \"----- applicationId -----\"; grep -n applicationId app/build.gradle || true\n\n__ICON_STEP__      - uses: actions/setup-java@v4\n        with:\n          distribution: temurin\n          java-version: 17\n\n      - name: Install NDK\n        run: |\n          SDKMGR=$(find \"$ANDROID_SDK_ROOT/cmdline-tools\" -name sdkmanager -type f | head -n 1)\n          echo \"sdkmanager: $SDKMGR\"\n          yes | \"$SDKMGR\" --licenses --sdk_root=\"$ANDROID_SDK_ROOT\" >/dev/null || true\n          yes | \"$SDKMGR\" --install \"ndk;26.1.10909125\" --sdk_root=\"$ANDROID_SDK_ROOT\"\n          echo \"ndk.dir=$ANDROID_SDK_ROOT/ndk/26.1.10909125\" >> SDL/android-project/local.properties\n\n      - name: Signing key (one key for all builds, so updates install over old versions)\n        run: |\n          base64 -d > SDL/android-project/game.keystore \u003c\u003c'KEYSTORE_EOF'\n          MIIKRgIBAzCCCfAGCSqGSIb3DQEHAaCCCeEEggndMIIJ2TCCBbAGCSqGSIb3DQEHAaCCBaEEggWdMIIFmTCCBZUGCyqGSIb3DQEM\n          CgECoIIFQDCCBTwwZgYJKoZIhvcNAQUNMFkwOAYJKoZIhvcNAQUMMCsEFAWCTTi5g1zWtUf2kHfrXIjzmuoxAgInEAIBIDAMBggq\n          hkiG9w0CCQUAMB0GCWCGSAFlAwQBKgQQIbHnndeClNkCp/ijjuZsrASCBNB4lzuP1JUFyl+roMBbKGeIVS3/VIkfgXw0dnTMoaOv\n          7G+tgyShcH8RJ5oH1kuYd1Uc5Awx1WAICBhdCe/kyOU4uAekBqA76OwuFsBpHwZ+beckVyAlUegQG9r04Y/iNuMBXKc/pvBBjrDL\n          0mkiUdNgti/XN57iGG8+7XPW7C6uqMFZFDyS8k0ibE/2cqMWsoy2tjXnk6JELY7kgo4Rr92axh3x7APApXF