          /* ====================== СОСТОЯНИЕ ====================== */
          var STORE_KEY = "mysteam.links.v1";
          var saved = {};
          try { saved = JSON.parse(localStorage.getItem(STORE_KEY) || "{}"); } catch (e) { saved = {}; }
          function persist(){ try { localStorage.setItem(STORE_KEY, JSON.stringify(saved)); } catch (e) {} }
          function getLink(g, t){ var s = saved[g.id]; if (s && typeof s[t] === "string") return s[t]; return g.links[t] || ""; }
          function setLink(g, t, v){ if (!saved[g.id]) saved[g.id] = {}; saved[g.id][t] = v.trim(); persist(); }
          function getPkg(g){ var s = saved[g.id]; return (s && typeof s.pkg === "string") ? s.pkg : g.pkg; }
          function setPkg(g, v){ if (!saved[g.id]) saved[g.id] = {}; saved[g.id].pkg = v.trim(); persist(); }
