          /* ====================== ЛАУНЧЕР ====================== */
          function gamesJson(){
            var arr = [];
            for (var i = 0; i < GAMES.length; i++) {
              var g = GAMES[i];
              arr.push({ name: g.name, pkg: getPkg(g) || "", apk: getLink(g, "apk"), version: g.version === "в разработке" ? "0.1" : g.version });
            }
            return JSON.stringify(arr, null, 2);
          }
          function gameJsonFor(g){
            var o = { name: g.name, version: g.version === "в разработке" ? "0.1" : g.version, description: g.short };
            if (g.id === "blockblast") o.python = "block_blast_v3.py";
            else o.exe = (g.id === "zombie" ? "ZombieSiege.exe" : "Mechanic3D.exe");
            o.cover = "cover.png"; o.color = g.color;
            return JSON.stringify(o, null, 2);
          }
          function viewLauncher(){
            var h = '<h2>Настройки и лаунчер</h2>';
            h += '<div class="box"><h4>Приложение</h4><p style="margin:0 0 6px;font-size:14px">'+(NATIVE?'Скачивание и установка игр работают прямо в этом приложении.':'Эта страница открыта в браузере: скачивание и установка работают только в приложении (APK).')+'</p><div class="linkrow"><label>GitHub-токен</label><input type="password" id="tok" placeholder="только для приватных репозиториев" value="'+esc(getToken())+'"><span class="st '+(getToken()?"ok":"")+'"></span></div><p class="hint">Нужен, если APK лежит в приватном репозитории (например Block Blast). Создай токен в GitHub: Settings → Developer settings → Personal access tokens, право на чтение содержимого (Contents: read). Токен хранится только на этом телефоне.</p></div>';
            h += '<div class="box"><h4>1. Для APK-лаунчера (Android)</h4><p style="margin:0 0 6px;font-size:14px">В приложении «Мои игры» нажми «Список» и вставь ссылку на файл games.json. Package name каждой игры - это applicationId из сборки (после первой сборки APK узнаешь).</p>';
            for (var i = 0; i < GAMES.length; i++) {
              var g = GAMES[i];
              h += '<div class="linkrow"><label>package: '+esc(g.name)+'</label><input type="text" placeholder="com.пример.игра" value="'+esc(getPkg(g))+'" data-pk="'+g.id+'"><span class="st '+(getPkg(g)?"ok":"")+'"></span></div>';
            }
            h += '<pre id="gj">'+esc(gamesJson())+'</pre><div class="row"><button class="btn play" id="cpj">Скопировать games.json</button></div>';
            h += '<p class="hint">Положи этот текст в файл games.json в публичный репозиторий. Ссылка на «сырой» файл будет вида https://raw.githubusercontent.com/ТВОЙ_ЛОГИН/РЕПОЗИТОРИЙ/main/games.json - её и вставляй в приложении.</p></div>';
            h += '<div class="box"><h4>2. Для Windows-лаунчера (launcher.py)</h4><p style="margin:0 0 6px;font-size:14px">Для каждой игры создай папку в games\\ и положи туда game.json (ниже) и файл игры.</p>';
            for (var j = 0; j < GAMES.length; j++) {
              var gg = GAMES[j];
              h += '<p style="margin:10px 0 2px;font-size:13px;color:#fff">games\\'+(gg.id==="blockblast"?"BlockBlast":gg.id==="zombie"?"ZombieSiege":"Mechanic3D")+'\\game.json</p><pre>'+esc(gameJsonFor(gg))+'</pre><div class="row"><button class="btn" data-gj="'+gg.id+'">Скопировать</button></div>';
            }
            h += '</div>';
            $("main").innerHTML = h;
            if ($("tok")) $("tok").oninput = function(){ setToken(this.value); this.parentNode.getElementsByClassName("st")[0].className = "st " + (this.value.trim() ? "ok" : ""); };
            var pk = $("main").querySelectorAll("[data-pk]");
            for (var a = 0; a < pk.length; a++) pk[a].oninput = function(){ setPkg(gameById(this.getAttribute("data-pk")), this.value); $("gj").textContent = gamesJson(); this.parentNode.getElementsByClassName("st")[0].className = "st " + (this.value.trim() ? "ok" : ""); };
            $("cpj").onclick = function(){ copyText(gamesJson(), "games.json скопирован"); };
            var gjs = $("main").querySelectorAll("[data-gj]");
            for (var b = 0; b < gjs.length; b++) gjs[b].onclick = function(){ copyText(gameJsonFor(gameById(this.getAttribute("data-gj"))), "game.json скопирован"); };
          }

          /* ====================== КАК ВЫЛОЖИТЬ ====================== */
          function viewHelp(){
            var h = '<h2>Как получить недостающие ссылки</h2>';
            var steps = [
              ["Ссылка на APK (для любой игры)", "1. Создай репозиторий на GitHub (можно приватный, но тогда ссылка работает только у тебя).\n2. Добавь файл .github/workflows/build.yml (для лаунчера он уже готов, для игр - шаблон SDL2 android-project).\n3. Actions → запусти сборку → внизу страницы Artifacts → скачай APK.\n4. Чтобы дать ссылку друзьям: Releases → Draft a new release → прикрепи APK → Publish. Ссылка на файл в релизе публичная (репозиторий должен быть публичным)."],
              ["Ссылка на itch.io", "1. itch.io → Dashboard → Create new project.\n2. Для игры в браузере: загрузи zip с index.html и поставь «This file will be played in the browser». Для Android - загрузи APK, для Windows - zip с exe и SDL2.dll.\n3. Сохрани и опубликуй (Visibility: Public). Ссылка вида https://твой-логин.itch.io/название."],
              ["Ссылка на Windows-версию", "1. Собери exe (см. «Установка» на странице игры).\n2. Положи exe и SDL2.dll в одну папку, сожми в zip.\n3. Загрузи zip в Releases на GitHub или на itch.io и скопируй ссылку на файл."],
              ["Опубликовать эту страницу как свой магазин", "Положи этот файл как index.html в публичный репозиторий и включи Settings → Pages → Branch: main. Страница откроется по адресу https://твой-логин.github.io/репозиторий/. Заполненные ссылки хранятся в браузере каждого посетителя: чтобы они были у всех, впиши их прямо в код (блок «ДАННЫЕ ИГР», поле links)."]
            ];
            for (var i = 0; i < steps.length; i++) h += '<div class="box"><h4>'+esc(steps[i][0])+'</h4><pre>'+esc(steps[i][1])+'</pre></div>';
            h += '<div class="box"><h4>Что уже известно</h4><div class="stats"><div class="stat"><b>2</b><span>ссылки заполнены</span></div><div class="stat"><b>3</b><span>игры в магазине</span></div><div class="stat"><b>0</b><span>ссылок на скачивание</span></div></div><p class="hint">Заполнены: itch.io профиль Block Blast и репозитории GitHub (Block Blast - приватный, Zombie Siege - для сборки APK). Для симулятора механика ссылок пока нет.</p></div>';
            $("main").innerHTML = h;
          }

          /* ====================== ГЛАВНЫЙ РЕНДЕР ====================== */
          function render(){
            renderNav();
            if (view === "store") viewStore(); else if (view === "lib") viewLib(); else if (view === "links") viewLinks(); else if (view === "launcher") viewLauncher(); else viewHelp();
          }
          render();
          </script>
          </body>
          </html>

          HTML_EOF

          cat > app/src/main/java/com/mygames/launcher/MainActivity.java <<'JAVA_EOF'
          package com.mygames.launcher;

          import android.app.Activity;
          import android.content.ClipData;
          import android.content.ClipboardManager;
          import android.content.Context;
          import android.content.Intent;
          import android.content.pm.PackageInfo;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.provider.Settings;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Toast;
          import androidx.core.content.FileProvider;
          import org.json.JSONArray;
          import org.json.JSONObject;
          import java.io.ByteArrayOutputStream;
          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.InputStream;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.util.regex.Matcher;
          import java.util.regex.Pattern;

          public class MainActivity extends Activity {
              private WebView web;
              private File pendingApk = null;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  getWindow().setStatusBarColor(0xFF1B2838);
                  getWindow().setNavigationBarColor(0xFF171A21);
                  web = new WebView(this);
                  web.setBackgroundColor(0xFF171A21);
                  setContentView(web);
                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setAllowFileAccess(true);
                  s.setMixedContentMode(WebSettings.MIXED_CONTENT_ALWAYS_ALLOW);
                  web.addJavascriptInterface(new Bridge(), "Android");
                  web.setWebViewClient(new WebViewClient());
                  web.loadUrl("file:///android_asset/index.html");
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  if (pendingApk != null && canInstall()) {
                      File f = pendingApk;
                      pendingApk = null;
                      installApk(f);
                  }
                  js("window.onResumeApp && window.onResumeApp()");
              }

              @Override
              public void onBackPressed() {
                  web.evaluateJavascript("(window.handleBack && window.handleBack()) ? '1' : '0'", value -> {
                      if (value == null || !value.contains("1")) finish();
                  });
              }

              private void js(final String code) {
                  runOnUiThread(() -> web.evaluateJavascript(code, null));
              }

              private boolean canInstall() {
                  return Build.VERSION.SDK_INT < 26 || getPackageManager().canRequestPackageInstalls();
              }

              private void installApk(File f) {
                  if (!canInstall()) {
                      pendingApk = f;
                      Toast.makeText(this, "Разреши установку из этого приложения и вернись назад", Toast.LENGTH_LONG).show();
                      startActivity(new Intent(Settings.ACTION_MANAGE_UNKNOWN_APP_SOURCES, Uri.parse("package:" + getPackageName())));
                      return;
                  }
                  try {
                      Uri uri = FileProvider.getUriForFile(this, getPackageName() + ".fileprovider", f);
                      Intent i = new Intent(Intent.ACTION_VIEW);
                      i.setDataAndType(uri, "application/vnd.android.package-archive");
                      i.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION | Intent.FLAG_ACTIVITY_NEW_TASK);
                      startActivity(i);
                  } catch (Exception e) {
                      Toast.makeText(this, "Не удалось открыть установщик: " + e, Toast.LENGTH_LONG).show();
                  }
              }

              // ---------------- сеть ----------------
              private static final Pattern GH = Pattern.compile("^https?://github\\.com/([^/\\s]+)/([^/\\s#?]+)(/releases(/latest)?)?/?$");

              private HttpURLConnection open(String url, String accept, String token) throws Exception {
                  String cur = url;
                  boolean keepAuth = token != null && !token.isEmpty();
                  for (int i = 0; i < 6; i++) {
                      URL u = new URL(cur);
                      HttpURLConnection c = (HttpURLConnection) u.openConnection();
                      c.setInstanceFollowRedirects(false);
                      c.setConnectTimeout(15000);
                      c.setReadTimeout(30000);
                      c.setRequestProperty("User-Agent", "MyGamesLauncher");
                      if (accept != null && !accept.isEmpty()) c.setRequestProperty("Accept", accept);
                      String host = u.getHost();
                      if (keepAuth && (host.equals("api.github.com") || host.equals("github.com"))) {
                          c.setRequestProperty("Authorization", "Bearer " + token);
                      }
                      int code = c.getResponseCode();
                      if (code >= 300 && code < 400 && c.getHeaderField("Location") != null) {
                          cur = new URL(u, c.getHeaderField("Location")).toString();
                          c.disconnect();
                          keepAuth = false;       // на другой хост токен не отправляем
                          accept = null;
                          continue;
                      }
                      if (code == 404) throw new Exception("не найдено (404). Если репозиторий приватный, укажи GitHub-токен в настройках");
                      if (code == 401 || code == 403) throw new Exception("нет доступа (" + code + "). Проверь токен или лимит запросов GitHub");
                      if (code != 200) throw new Exception("HTTP " + code);
                      return c;
                  }
                  throw new Exception("слишком много перенаправлений");
              }

              private String httpText(String url, String token) throws Exception {
                  HttpURLConnection c = open(url, "application/vnd.github+json", token);
                  InputStream in = c.getInputStream();
                  ByteArrayOutputStream bo = new ByteArrayOutputStream();
                  byte[] buf = new byte[8192];
                  int n;
                  long total = 0;
                  while ((n = in.read(buf)) > 0) {
                      bo.write(buf, 0, n);
                      total += n;
                      if (total > 3_000_000) throw new Exception("ответ слишком большой");
                  }
                  in.close();
                  return bo.toString("UTF-8");
              }

              // для репозитория GitHub находим APK в последнем релизе; прямую ссылку возвращаем как есть
              private String[] resolveApk(String url, String token) throws Exception {
                  Matcher m = GH.matcher(url.trim());
                  if (!m.find()) return new String[]{url.trim(), ""};
                  String api = "https://api.github.com/repos/" + m.group(1) + "/" + m.group(2) + "/releases/latest";
                  JSONObject rel = new JSONObject(httpText(api, token));
                  JSONArray assets = rel.optJSONArray("assets");
                  if (assets == null || assets.length() == 0) throw new Exception("в последнем релизе нет файлов");
                  JSONObject pick = null;
                  for (int i = 0; i < assets.length(); i++) {
                      JSONObject a = assets.getJSONObject(i);
                      if (a.optString("name").toLowerCase().endsWith(".apk")) { pick = a; break; }
                  }
                  if (pick == null) throw new Exception("в последнем релизе нет файла .apk");
                  if (token != null && !token.isEmpty()) return new String[]{pick.getString("url"), "application/octet-stream"};
                  return new String[]{pick.getString("browser_download_url"), ""};
              }

              // ---------------- мост для страницы ----------------
              public class Bridge {
                  @JavascriptInterface
                  public String info(String pkg) {
                      if (pkg == null || pkg.isEmpty()) return "{\"installed\":false}";
                      try {
                          PackageInfo p = getPackageManager().getPackageInfo(pkg, 0);
                          JSONObject o = new JSONObject();
                          o.put("installed", true);
                          o.put("version", p.versionName == null ? "" : p.versionName);
                          return o.toString();
                      } catch (Exception e) {
                          return "{\"installed\":false}";
                      }
                  }

                  @JavascriptInterface
                  public boolean launch(String pkg) {
                      try {
                          Intent it = getPackageManager().getLaunchIntentForPackage(pkg);
                          if (it == null) return false;
                          it.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                          startActivity(it);
                          return true;
                      } catch (Exception e) {
                          return false;
                      }
                  }

                  @JavascriptInterface
                  public void uninstall(final String pkg) {
                      runOnUiThread(() -> startActivity(new Intent(Intent.ACTION_DELETE, Uri.parse("package:" + pkg))));
                  }

                  @JavascriptInterface
                  public void openUrl(final String url) {
                      runOnUiThread(() -> {
                          try {
                              startActivity(new Intent(Intent.ACTION_VIEW, Uri.parse(url)));
                          } catch (Exception e) {
                              Toast.makeText(MainActivity.this, "Не удалось открыть ссылку", Toast.LENGTH_SHORT).show();
                          }
                      });
                  }

                  @JavascriptInterface
                  public void copy(final String text) {
                      runOnUiThread(() -> {
                          ClipboardManager cm = (ClipboardManager) getSystemService(Context.CLIPBOARD_SERVICE);
                          cm.setPrimaryClip(ClipData.newPlainText("text", text));
                      });
                  }

                  @JavascriptInterface
                  public void download(final String id, final String url, final String token) {
                      new Thread(() -> doDownload(id, url, token)).start();
                  }
              }

              private void doDownload(String id, String url, String token) {
                  final String jid = JSONObject.quote(id);
                  try {
                      js("window.onDl(" + jid + ",-1," + JSONObject.quote("Ищем файл…") + ")");
                      String[] r = resolveApk(url, token);
                      File dir = new File(getExternalFilesDir(null), "apk");
                      dir.mkdirs();
                      File out = new File(dir, id.replaceAll("[^A-Za-z0-9_]", "_") + ".apk");
                      HttpURLConnection c = open(r[0], r[1], r[1].isEmpty() ? "" : token);
                      long total = c.getContentLength();
                      InputStream in = c.getInputStream();
                      FileOutputStream fo = new FileOutputStream(out);
                      byte[] buf = new byte[65536];
                      long done = 0;
                      int n, last = -1;
                      while ((n = in.read(buf)) > 0) {
                          fo.write(buf, 0, n);
                          done += n;
                          if (total > 0) {
                              int pct = (int) (done * 100 / total);
                              if (pct != last) {
                                  last = pct;
                                  js("window.onDl(" + jid + "," + pct + "," + JSONObject.quote("Загрузка…") + ")");
                              }
                          }
                      }
                      fo.close();
                      in.close();
                      PackageInfo pi = getPackageManager().getPackageArchiveInfo(out.getAbsolutePath(), 0);
                      if (pi == null) {
                          out.delete();
                          throw new Exception("скачанный файл не похож на APK (для приватного репозитория нужен токен)");
                      }
                      final File apk = out;
                      js("window.onDlDone(" + jid + ",true," + JSONObject.quote("Установка запущена") + "," + JSONObject.quote(pi.packageName) + ")");
                      runOnUiThread(() -> installApk(apk));
                  } catch (Exception e) {
                      js("window.onDlDone(" + jid + ",false," + JSONObject.quote("Ошибка загрузки: " + e.getMessage()) + ",\"\")");
                  }
              }
          }

          JAVA_EOF

      - name: Build APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Prepare file name
        run: cp app/build/outputs/apk/debug/app-debug.apk MoiSteam.apk

      - uses: actions/upload-artifact@v4
        with:
          name: moi-steam-apk
          path: MoiSteam.apk

      - name: Publish release (APK for download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: launcher-${{ github.run_number }}
          name: Мой Steam (сборка ${{ github.run_number }})
          files: MoiSteam.apk
