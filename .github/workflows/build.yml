name: Build Мои игры (APK)

# Один файл на весь проект: при каждой сборке он сам создаёт все файлы Android-приложения
# (манифест, gradle, код на Java, интерфейс в виде HTML) и собирает подписанный APK.
# Готовый APK берётся из Releases (вкладка справа в репозитории) или из Actions -> запуск -> Artifacts.
# Подпись у всех сборок одна и та же, поэтому новую версию можно ставить поверх старой.
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Create project files
        run: |
          mkdir -p app/src/main/java/com/mygames/launcher app/src/main/res/xml app/src/main/assets
          # значок приложения (Игротека)
          mkdir -p app/src/main/res/mipmap-mdpi app/src/main/res/mipmap-hdpi app/src/main/res/mipmap-xhdpi app/src/main/res/mipmap-xxhdpi app/src/main/res/mipmap-xxxhdpi
