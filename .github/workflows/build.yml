              var up = await ghPutPicked("/repos/" + owner + "/" + repo + "/contents/" + path, "Игра: " + name, "", t.token);
              if (up.code !== 201 && up.code !== 200) throw new Error("не удалось загрузить файл игры: " + ghErr(up));
