              var cols = ["#e8a33a","#e0524f","#4bb3e0","#6cc24a","#a56ee0","#f0d23c"];
              var pat = [[0,0,1,2,0,0,3,3],[0,1,1,2,2,0,0,3],[4,4,0,0,5,5,5,0],[4,0,0,3,3,0,5,0],[0,0,2,2,0,1,1,0]];
              for (var r = 0; r < 5; r++) for (var c = 0; c < 8; c++) {
                var v = pat[r][c]; if (!v && v !== 0) continue;
                var on = (pat[r][c] > 0) || ((r + c) % 3 === 0 && r > 2);
                s += '<rect x="'+(60+c*34)+'" y="'+(30+r*30)+'" width="30" height="26" rx="5" fill="'+(on?cols[(r*3+c)%cols.length]:"rgba(255,255,255,.07)")+'"/>';
              }
