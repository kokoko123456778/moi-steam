              s += '<defs><linearGradient id="gz" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a0c10"/><stop offset="1" stop-color="#0c0507"/></linearGradient></defs><rect width="400" height="200" fill="url(#gz)"/>';
              s += '<circle cx="320" cy="46" r="26" fill="#e9d9a8" opacity=".9"/><circle cx="330" cy="40" r="22" fill="#2a0c10" opacity=".35"/>';
              s += '<g fill="#12090b"><rect x="0" y="120" width="60" height="80"/><rect x="50" y="95" width="46" height="105"/><rect x="95" y="130" width="60" height="70"/><rect x="250" y="110" width="50" height="90"/><rect x="300" y="135" width="100" height="65"/></g>';
              s += '<g><rect x="150" y="100" width="60" height="100" rx="6" fill="#1e3a24"/><circle cx="180" cy="86" r="26" fill="#3b6b43"/><circle cx="170" cy="82" r="5" fill="#ff3b3b"/><circle cx="192" cy="82" r="5" fill="#ff3b3b"/><rect x="168" y="98" width="26" height="5" fill="#1a0a0a"/></g>';
              s += '<g stroke="#fff" stroke-width="2" opacity=".75"><line x1="180" y1="150" x2="180" y2="170"/><line x1="170" y1="160" x2="190" y2="160"/></g>';
            } else if (kind === "generic") {
              s += '<defs><linearGradient id="gg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3a2a7a"/><stop offset="1" stop-color="#142a52"/></linearGradient></defs><rect width="400" height="200" fill="url(#gg)"/><g fill="#c7d5e0" opacity=".85"><rect x="150" y="80" width="100" height="50" rx="22"/></g><g fill="#2a1f55"><rect x="172" y="98" width="26" height="6"/><rect x="182" y="88" width="6" height="26"/><circle cx="222" cy="96" r="5"/><circle cx="234" cy="108" r="5"/></g>';
            } else {
              s += '<defs><linearGradient id="gc" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a79c9"/><stop offset="1" stop-color="#173a62"/></linearGradient></defs><rect width="400" height="200" fill="url(#gc)"/>';
              s += '<rect y="150" width="400" height="50" fill="#2a2f38"/><g fill="#e8c53a"><rect x="20" y="172" width="40" height="5"/><rect x="120" y="172" width="40" height="5"/><rect x="220" y="172" width="40" height="5"/><rect x="320" y="172" width="40" height="5"/></g>';
              s += '<g><path d="M90 150 L100 120 Q110 100 140 98 L240 98 Q270 100 285 124 L300 150 Z" fill="#e8e8ee"/><path d="M118 118 L132 104 L200 104 L200 120 Z" fill="#1f3a5a"/><path d="M208 104 L244 104 L262 120 L208 120 Z" fill="#1f3a5a"/><circle cx="130" cy="152" r="17" fill="#15181d"/><circle cx="130" cy="152" r="8" fill="#9aa4b0"/><circle cx="262" cy="152" r="17" fill="#15181d"/><circle cx="262" cy="152" r="8" fill="#9aa4b0"/><rect x="150" y="82" width="64" height="16" rx="4" fill="#e8c53a"/><rect x="171" y="87" width="22" height="6" fill="#171a21"/></g>';
              s += '<g fill="none" stroke="#e8c53a" stroke-width="5" stroke-linecap="round" opacity=".9"><path d="M330 40 L360 70"/><circle cx="322" cy="32" r="12"/></g>';
            }
