          .plat i{font-style:normal;background:#0f1722;border:1px solid var(--line);border-radius:4px;padding:2px 7px;font-size:11px;color:#b9c6d2}
          .price{color:var(--green2);font-weight:800;font-size:13px;margin-top:6px}
          .lib{display:grid;grid-template-columns:230px 1fr;gap:14px}
          @media (max-width:760px){ .lib{grid-template-columns:1fr} .libside{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px} .libside .item{flex:0 0 auto} }
          .libside{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px}
          .item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:7px;cursor:pointer;color:var(--txt);font-size:14px}
          .item:hover{background:#243a52}
          .item.on{background:#2b4764;color:#fff}
          .item .dot{width:26px;height:26px;border-radius:6px;flex:0 0 auto}
          .hero{border-radius:12px;overflow:hidden;border:1px solid var(--line);background:var(--card)}
          .hero .art{height:200px;position:relative}
          .hero .art .ttl{position:absolute;left:16px;bottom:12px;font-size:28px;font-weight:900;color:#fff;text-shadow:0 2px 10px #000}
          .hero .info{padding:14px 16px}
          .hero .info .meta{display:flex;flex-wrap:wrap;gap:14px;color:var(--mut);font-size:13px;margin:6px 0 10px}
          .actions{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 4px}
          .btn{display:inline-flex;align-items:center;gap:6px;border:0;border-radius:6px;padding:10px 16px;font-size:14px;font-weight:800;cursor:pointer;text-decoration:none;color:#fff;background:#2a475e}
          .btn:hover{background:#3d6c8e}
          .btn.play{background:linear-gradient(#5ba32b,#4c9a2a);font-size:16px}
          .btn.play:hover{background:linear-gradient(#6bb83a,#58a82e)}
          .btn.off{background:#2a2f38;color:#7b8794;cursor:pointer}
          .sub{display:flex;gap:4px;margin:14px 0 8px;border-bottom:1px solid var(--line)}
          .sub button{background:none;border:0;color:var(--mut);font-weight:700;padding:8px 12px;cursor:pointer;border-bottom:2px solid transparent;font-size:14px}
          .sub button.on{color:#fff;border-bottom-color:var(--acc)}
          .sec p,.sec li{line-height:1.5;font-size:14px}
          .sec ul,.sec ol{padding-left:20px;margin:6px 0}
          .box{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin:10px 0}
          .box h4{margin:0 0 6px;color:#fff;font-size:15px}
          code,pre{font-family:ui-monospace,Menlo,Consolas,monospace}
          pre{background:#0d131c;border:1px solid var(--line);border-radius:6px;padding:10px;overflow:auto;font-size:12px;line-height:1.45;margin:6px 0;white-space:pre-wrap;word-break:break-word}
          .linkrow{display:grid;grid-template-columns:150px 1fr 24px;gap:8px;align-items:center;margin:7px 0}
          @media (max-width:620px){ .linkrow{grid-template-columns:1fr 24px} .linkrow label{grid-column:1/-1;margin-bottom:-4px} }
          .linkrow label{font-size:13px;color:#b9c6d2}
          .linkrow input{width:100%;background:#0d131c;border:1px solid var(--line);border-radius:6px;color:#fff;padding:9px 10px;font-size:13px;min-width:0}
          .linkrow input:focus{outline:none;border-color:var(--acc)}
          .st{width:14px;height:14px;border-radius:50%;background:#555;justify-self:center}
          .st.ok{background:#4c9a2a}.st.bad{background:#c0392b}
          .hint{font-size:12px;color:var(--mut);margin:2px 0 0}
          .row{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
          .toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#0d131c;border:1px solid var(--acc);color:#fff;padding:10px 16px;border-radius:8px;font-size:14px;z-index:20;opacity:0;pointer-events:none;transition:opacity .2s}
          .toast.show{opacity:1}
          .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
          .stat{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px;text-align:center}
          .stat b{display:block;color:#fff;font-size:20px}
          .stat span{font-size:12px;color:var(--mut)}
          </style>
          </head>
