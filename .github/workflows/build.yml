ctions/upload-artifact@v4\n        with:\n          name: apk\n          path: ${{ env.APK_NAME }}\n\n      - name: Publish release (APK for the Steam app)\n        uses: softprops/action-gh-release@v2\n        with:\n          tag_name: v${{ github.run_number }}\n          name: ${{ env.APP_LABEL }} (сборка ${{ github.run_number }})\n          files: ${{ env.APK_NAME }}\n", "html": "name: build-apk\n\n# Создано «Игротекой». Собирает Android-приложение из index.html (игра на HTML5) и выкладывает APK в Releases.\non:\n  push:\n    branches: [ main, master ]\n  workflow_dispatch:\n\npermissions:\n  contents: write\n\nenv:\n  APP_ID: __APP_ID__\n  APP_NAME: __APP_NAME__\n\nconcurrency:\n  group: build-apk\n  cancel-in-progress: true\n\njobs:\n  build:\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v4\n\n      - uses: actions/setup-java@v4\n        with:\n          distribution: temurin\n          java-version: '17'\n\n      - uses: android-actions/setup-android@v3\n        with:\n          packages: 'platform-tools'\n\n      - uses: gradle/actions/setup-gradle@v3\n        with:\n          gradle-version: '8.5'\n\n      - name: Create project files\n        run: |\n          set -e\n          if [ ! -f index.html ]; then echo \"Нет файла index.html в репозитории\"; exit 1; fi\n          mkdir -p app/src/main/java/com/kokoko/game app/src/main/assets\n          mkdir -p app/src/main/res/mipmap-mdpi app/src/main/res/mipmap-hdpi app/src/main/res/mipmap-xhdpi app/src/main/res/mipmap-xxhdpi app/src/main/res/mipmap-xxxhdpi\n          cp index.html app/src/main/assets/index.html\n__ICONS_HTML__          base64 -d > app/game.keystore \u003c\u003c'KEYSTORE_EOF'\n          \n          KEYSTORE_EOF\n          cat > settings.gradle \u003c\u003c'SETTINGS_EOF'\n          pluginManagement {\n              repositories {\n                  google()\n                  mavenCentral()\n                  gradlePluginPortal()\n              }\n          }\n          dependencyResolutionManagement {\n              repositories {\n                  google()\n                  mavenCentral()\n              }\n          }\n          rootProject.name = \"Game\"\n          include ':app'\n          SETTINGS_EOF\n\n          cat > build.gradle \u003c\u003c'ROOT_EOF'\n          plugins {\n              id 'com.android.application' version '8.2.2' apply false\n          }\n          ROOT_EOF\n\n          cat > gradle.properties \u003c\u003c'PROPS_EOF'\n          android.useAndroidX=true\n          org.gradle.jvmargs=-Xmx2g\n          PROPS_EOF\n\n          cat > app/build.gradle \u003c\u003cAPP_EOF\n          plugins {\n              id 'com.android.application'\n          }\n          android {\n              namespace 'com.kokoko.game'\n              compileSdk 34\n              defaultConfig {\n                  applicationId '${APP_ID}'\n                  minSdk 21\n                  targetSdk 34\n                  versionCode ${GITHUB_RUN_NUMBER}\n                  versionName '1.${GITHUB_RUN_NUMBER}'\n              }\n              signingConfigs {\n                  mygames {\n                      storeFile file('game.keystore')\n                      storePassword 'mygames123'\n                      keyAlias 'mygames'\n                      keyPassword 'mygames123'\n                  }\n              }\n              buildTypes {\n                  debug {\n                      signingConfig signingConfigs.mygames\n                  }\n              }\n              compileOptions {\n                  sourceCompatibility JavaVersion.VERSION_17\n                  targetCompatibility JavaVersion.VERSION_17\n              }\n          }\n          APP_EOF\n\n          cat > app/src/main/AndroidManifest.xml \u003c\u003cMANIFEST_EOF\n          \u003c?xml version=\"1.0\" encoding=\"utf-8\"?>\n          \u003cmanifest xmlns:android=\"http://schemas.android.com/apk/res/android\">\n              \u003capplication\n                  android:label=\"${APP_NAME}\"\n                  android:icon=\"@mipmap/ic_launcher\"\n                  android:roundIcon=\"@mipmap/ic_launcher\"\n                  android:allowBackup=\"true\"\n                  android:hardwareAccelerated=\"true\"\n                  android:theme=\"@android:style/Theme.Material.NoActionBar.Fullscreen\">\n                  \u003cactivity\n                      android:name=\".MainActivity\"\n                      android:exported=\"true\"\n                      android:screenOrientation=\"__ORIENT__\"\n                      android:configChanges=\"orientation|screenSize|keyboardHidden\">\n                      \u003cintent-filter>\n                          \u003caction android:name=\"android.intent.action.MAIN\" />\n                          \u003ccategory android:name=\"android.intent.category.LAUNCHER\" />\n                      \u003c/intent-filter>\n                  \u003c/activity>\n              \u003c/application>\n          \u003c/manifest>\n          MANIFEST_EOF\n\n          cat > app/src/main/java/com/kokoko/game/MainActivity.java \u003c\u003c'JAVA_EOF'\n          package com.kokoko.game;\n\n          import android.app.Activity;\n          import android.os.Build;\n          import android.os.Bundle;\n          import android.view.View;\n          import android.view.WindowManager;\n          import android.webkit.WebSettings;\n          import android.webkit.WebView;\n          import android.webkit.WebViewClient;\n\n          public class MainActivity extends Activity {\n              private WebView web;\n\n              @Override\n              protected void onCreate(Bundle savedInstanceState) {\n                  super.onCreate(savedInstanceState);\n                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);\n                  if (Build.VERSION.SDK_INT >= 28) {\n                      getWindow().getAttributes().layoutInDisplayCutoutMode = WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES;\n                  }\n                  web = new WebView(this);\n                  web.setBackgroundColor(0xFF000000);\n                  setContentView(web);\n                  WebSettings s = web.getSettings();\n                  s.setJavaScriptEnabled(true);\n                  s.setDomStorageEnabled(true);\n                  s.setMediaPlaybackRequiresUserGesture(false);\n                  web.setWebViewClient(new WebViewClient());\n                  web.loadUrl(\"file:///android_asset/index.html\");\n                  hideBars();\n              }\n\n              private void hideBars() {\n                  getWindow().getDecorView().setSystemUiVisibility(View.SYSTEM_UI_FLAG_FULLSCREEN | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION\n                      | View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY | View.SYSTEM_UI_FLAG_LAYOUT_STABLE\n                      | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN);\n              }\n\n              @Override\n              public void onWindowFocusChanged(boolean hasFocus) {\n                  super.onWindowFocusChanged(hasFocus);\n                  if (hasFocus) hideBars();\n              }\n\n              @Override\n              protected void onPause() {\n                  super.onPause();\n                  if (web != null) { web.evaluateJavascript(\"window.dispatchEvent(new Event('pagehide'))\", null); web.onPause(); }\n              }\n\n              @Override\n              protected void onResume() {\n                  super.onResume();\n                  if (web != null) web.onResume();\n              }\n          }\n          JAVA_EOF\n\n      - name: Build APK\n        run: gradle assembleDebug --no-daemon --stacktrace\n\n      - name: Prepare file name\n        run: cp app/build/outputs/apk/debug/app-debug.apk Game.apk\n\n      - uses: actions/upload-artifact@v4\n        with:\n          name: game-apk\n          path: Game.apk\n\n      - name: Publish release (APK for Игротека)\n        uses: softprops/action-gh-release@v2\n        with:\n          tag_name: v${{ github.run_number }}\n          name: ${{ env.APP_NAME }} (сборка ${{ github.run_number }})\n          files: Game.apk\n", "py": "name: build-apk\n\n# Создано «Игротекой». Собирает APK игры на pygame через Buildozer и публикует его в Releases. Сборка идёт 20-30 минут.\non:\n  push:\n    branches: [ main, master ]\n  workflow_dispatch:\n\npermissions:\n  contents: write\n\nenv:\n  APP_TITLE: __APP_NAME__\n  APP_NAME: __PKG_NAME__\n  APP_DOMAIN: com.kokoko\n  APP_VERSION: \"1.0\"\n  APK_NAME: Game.apk\n\nconcurrency:\n  group: build-apk\n  cancel-in-progress: true\n\njobs:\n  build-apk:\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v4\n\n      - uses: actions/setup-python@v5\n        with:\n          python-version: '3.10'\n\n      - name: System packages\n        run: |\n          sudo apt-get update\n          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf automake autoconf-archive libtool libltdl-dev pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev\n\n      - name: Prepare the game (main.py and buildozer.spec)\n        run: |\n          SRC=$(ls -1 *.py | grep -v '^main.py$' | sort -V | tail -n 1)\n          if [ -z \"$SRC\" ]; then SRC=main.py; fi\n          echo \"Файл игры: $SRC\"\n          [ \"$SRC\" != \"main.py\" ] && cp \"$SRC\" main.py\n__ICON_PY__          cat > buildozer.spec \u003c\u003cSPEC_EOF\n          [app]\n          title = $APP_TITLE\n          package.name = $APP_NAME\n          package.domain = $APP_DOMAIN\n          source.dir = .\n          source.include_exts = py,png,jpg,wav,ogg,mp3,json,ttf\n          source.exclude_dirs = .git,.github,bin,.buildozer\n          version = $APP_VERSION\n          requirements = python3==3.10.12,hostpython3==3.10.12,pygame\n          p4a.branch = v2023.09.16\n          android.ndk = 25b\n          orientation = __ORIENT__