              out.push("");
            }
            return out.join("\n");
          }
          function viewLinks(){
            var h = '<h2>Все ссылки</h2><p class="hint" style="margin:0 0 10px">Впиши ссылку, и кнопки на странице игры появятся сами. Данные хранятся в этом браузере. Зелёная точка - ссылка выглядит правильно, красная - не похоже на ссылку.</p>';
            h += '<div class="box"><h4>Добавить свою игру</h4><div class="linkrow"><label>Название</label><input type="text" id="cgName" placeholder="Моя новая игра"><span></span></div><div class="linkrow"><label>APK или GitHub</label><input type="url" id="cgApk" placeholder="https://github.com/логин/репозиторий" inputmode="url"><span></span></div><div class="row"><button class="btn play" id="cgAdd">+ Добавить в библиотеку</button></div><p class="hint">В поле APK можно вставить ссылку на сам файл .apk или ссылку на GitHub-репозиторий: тогда приложение само возьмёт APK из последнего релиза.</p></div>';
