          }

          /* ====================== ВСПОМОГАТЕЛЬНОЕ ====================== */
          function $(id){ return document.getElementById(id); }
          function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
          function toast(msg){ var t = $("toast"); t.textContent = msg; t.className = "toast show"; clearTimeout(toast._t); toast._t = setTimeout(function(){ t.className = "toast"; }, 1800); }
          function copyText(text, msg){
            var done = function(){ toast(msg || "Скопировано"); };
            try {
              if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(text).then(done, function(){ fallbackCopy(text); done(); }); return; }
            } catch (e) {}
            fallbackCopy(text); done();
          }
          function fallbackCopy(text){
            var ta = document.createElement("textarea"); ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
            document.body.appendChild(ta); ta.focus(); ta.select();
            try { document.execCommand("copy"); } catch (e) {}
            document.body.removeChild(ta);
          }
          function gameById(id){ for (var i = 0; i < GAMES.length; i++) if (GAMES[i].id === id) return GAMES[i]; return GAMES[0]; }
          function linkCount(g){ var n = 0; for (var i = 0; i < LINK_TYPES.length; i++) if (isUrl(getLink(g, LINK_TYPES[i][0]))) n++; return n; }

          /* ====================== НАВИГАЦИЯ ====================== */
          var TABS = [["store","Магазин"],["lib","Библиотека"],["links","Ссылки"],["launcher","Лаунчер"],["help","Как выложить"]];
          function go(v, gid, sub){ view = v; if (gid) curGame = gid; if (sub) subTab = sub; render(); window.scrollTo(0, 0); }
          function renderNav(){
            var h = ""; for (var i = 0; i < TABS.length; i++) h += '<button class="'+(view===TABS[i][0]?"on":"")+'" data-v="'+TABS[i][0]+'">'+TABS[i][1]+'</button>';
