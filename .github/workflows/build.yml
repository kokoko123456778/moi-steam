          /* ====================== МАГАЗИН ====================== */
          function viewStore(){
            var h = '<h2>Новое и популярное</h2><div class="grid">';
            for (var i = 0; i < GAMES.length; i++) {
              var g = GAMES[i];
              h += '<div class="card" data-g="'+g.id+'"><div class="art">'+artSVG(g.art)+'</div><div class="body"><h3>'+esc(g.name)+'</h3><p>'+esc(g.short)+'</p>'
                + '<div class="tags">'+g.tags.map(function(t){return '<span class="tag">'+esc(t)+'</span>';}).join("")+'</div>'
                + '<div class="plat">'+g.platforms.map(function(p){return '<i>'+esc(p)+'</i>';}).join("")+'</div><div class="price">'+esc(g.price)+'</div></div></div>';
            }
            h += '</div><div class="box" style="margin-top:16px"><h4>О магазине</h4><p style="margin:0;font-size:14px;line-height:1.5;color:var(--mut)">Это своя «копия Steam» для трёх игр: у каждой есть страница, описание, инструкции установки и кнопки со ссылками. Ссылки на APK заполняются в разделе «Ссылки»: в приложении кнопка «Скачать и установить» качает игру, ставит её и потом запускает.</p></div>';
            $("main").innerHTML = h;
            var cards = $("main").getElementsByClassName("card");
            for (var c = 0; c < cards.length; c++) cards[c].onclick = function(){ go("lib", this.getAttribute("data-g"), "desc"); };
          }

          /* ====================== ФУНКЦИИ ПРИЛОЖЕНИЯ (Android) ====================== */
          function gameInfo(g){ var pk = getPkg(g); if (!pk) return { installed:false }; try { return JSON.parse(Android.info(pk)); } catch (e) { return { installed:false }; } }
          function nativeButtons(g){
            var inf = gameInfo(g), apk = getLink(g, "apk"), d = dl[g.id], h = "";
            if (d && d.busy) {
              var bar = d.pct >= 0 ? '<div style="height:6px;background:#0d131c;border-radius:3px;margin-top:6px"><div style="height:6px;width:'+d.pct+'%;background:#5ba32b;border-radius:3px"></div></div>' : "";
              return '<div class="btn off" style="flex:1;display:block">'+esc(d.msg || "Загрузка…")+(d.pct >= 0 ? " " + d.pct + "%" : "")+bar+'</div>';
            }
            if (inf.installed) {
              h += '<button class="btn play" data-act="launch">▶ Играть</button>';
              if (apk) h += '<button class="btn" data-act="update">⟳ Обновить</button>';
              h += '<button class="btn off" data-act="remove">Удалить</button>';
            } else if (apk) h += '<button class="btn play" data-act="install">⬇ Скачать и установить</button>';
            else h += '<button class="btn off" data-need="apk">Нет ссылки на APK</button>';
            if (inf.installed && inf.version) h += '<div class="hint" style="width:100%">Установлена версия: ' + esc(inf.version) + '</div>';
            return h;
          }
          function otherLinks(g){
            var h = '<div class="actions">';
            for (var t = 0; t < LINK_TYPES.length; t++) { var key = LINK_TYPES[t][0], v = getLink(g, key); if (key === "apk" || key === "source" || key === "win" || !isUrl(v)) continue; h += '<a class="btn" href="'+esc(v)+'" target="_blank" rel="noopener">'+esc(LINK_TYPES[t][1])+'</a>'; }
            return h + '</div>';
          }
          function doAct(g, a){
            var pk = getPkg(g);
            if (a === "install" || a === "update") {
              var url = getLink(g, "apk"); if (!isUrl(url)) { toast("Нет ссылки на APK"); return; }
              dl[g.id] = { busy:true, pct:-1, msg:"Подготовка…" }; render();
              Android.download(g.id, url, getToken());
            } else if (a === "launch") { if (!pk || !Android.launch(pk)) toast("Не удалось запустить игру"); }
            else if (a === "remove") { if (pk) Android.uninstall(pk); }
          }
          window.onDl = function(id, pct, msg){ dl[id] = { busy:true, pct:pct, msg:msg }; if (view === "lib" && curGame === id) render(); };
