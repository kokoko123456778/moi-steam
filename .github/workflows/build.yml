              for (var t = 0; t < LINK_TYPES.length; t++) {
                var key = LINK_TYPES[t][0], v = getLink(g, key), ok = isUrl(v);
                h += '<div class="linkrow"><label>'+esc(LINK_TYPES[t][1])+'</label><input type="url" inputmode="url" placeholder="https://..." value="'+esc(v)+'" data-g="'+g.id+'" data-t="'+key+'"><span class="st '+(v?(ok?"ok":"bad"):"")+'"></span></div>';
