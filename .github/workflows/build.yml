            delete dl[id];
            if (ok && pkg) { var g = gameById(id); setPkg(g, pkg); if (g.custom) saveCustom(); }
            toast(msg || (ok ? "Готово" : "Ошибка"));
            render();
          };
          window.onResumeApp = function(){ if (view === "lib" || view === "launcher") render(); };
          window.handleBack = function(){ if (view !== "store") { go("store"); return true; } return false; };
          if (NATIVE) document.addEventListener("click", function(e){
            var a = e.target && e.target.closest ? e.target.closest("a[href]") : null;
