              private void js(final String code) {
                  runOnUiThread(() -> web.evaluateJavascript(code, null));
              }

              // ---------- выбор файла и запросы к GitHub (для «Новая игра из файла») ----------
              private static final int PICK_REQ = 4242;
              private String pickId = null, pickedName = "";
              private byte[] pickedBytes = null;

              @Override
              protected void onActivityResult(int req, int res, Intent data) {
                  super.onActivityResult(req, res, data);
                  if (req != PICK_REQ || pickId == null) return;
                  final String id = JSONObject.quote(pickId);
                  pickId = null;
                  if (res != RESULT_OK || data == null || data.getData() == null) { js("window.onPicked(" + id + ",\"\",-1)"); return; }
                  final Uri uri = data.getData();
                  new Thread(() -> {
                      try {
                          String name = "game";
                          android.database.Cursor cur = getContentResolver().query(uri, null, null, null, null);
                          if (cur != null) { int ni = cur.getColumnIndex(android.provider.OpenableColumns.DISPLAY_NAME); if (cur.moveToFirst() && ni >= 0) name = cur.getString(ni); cur.close(); }
                          InputStream in = getContentResolver().openInputStream(uri);
                          ByteArrayOutputStream bo = new ByteArrayOutputStream();
                          byte[] buf = new byte[65536]; int n; long total = 0;
                          while ((n = in.read(buf)) > 0) { bo.write(buf, 0, n); total += n; if (total > 60_000_000) throw new Exception("файл больше 60 МБ"); }
                          in.close();
                          pickedBytes = bo.toByteArray(); pickedName = name;
                          js("window.onPicked(" + id + "," + JSONObject.quote(name) + "," + pickedBytes.length + ")");
                      } catch (Exception e) {
                          js("window.onPicked(" + id + ",\"\",-1)");
                          runOnUiThread(() -> Toast.makeText(this, "Не удалось прочитать файл: " + e.getMessage(), Toast.LENGTH_LONG).show());
                      }
                  }).start();
              }

              private void ghCall(String id, String method, String url, String body, String token) {
                  final String jid = JSONObject.quote(id);
                  try {
                      HttpURLConnection c = (HttpURLConnection) new URL(url).openConnection();
                      c.setRequestMethod(method);
                      c.setConnectTimeout(20000);
                      c.setReadTimeout(120000);
                      c.setRequestProperty("User-Agent", "MyGamesLauncher");
                      c.setRequestProperty("Accept", "application/vnd.github+json");
                      c.setRequestProperty("X-GitHub-Api-Version", "2022-11-28");
                      if (token != null && !token.isEmpty()) c.setRequestProperty("Authorization", "Bearer " + token);
                      if (body != null && !body.isEmpty()) {
                          byte[] b = body.getBytes("UTF-8");
                          c.setDoOutput(true);
                          c.setRequestProperty("Content-Type", "application/json; charset=utf-8");
                          c.setFixedLengthStreamingMode(b.length);
                          java.io.OutputStream os = c.getOutputStream(); os.write(b); os.close();
                      }
                      int code = c.getResponseCode();
                      InputStream in = code >= 400 ? c.getErrorStream() : c.getInputStream();
                      String text = "";
                      if (in != null) {
                          ByteArrayOutputStream bo = new ByteArrayOutputStream(); byte[] buf = new byte[8192]; int n; long total = 0;
                          while ((n = in.read(buf)) > 0) { bo.write(buf, 0, n); total += n; if (total > 4_000_000) break; }
                          in.close(); text = bo.toString("UTF-8");
                      }
                      js("window.onGh(" + jid + "," + code + "," + JSONObject.quote(text) + ")");
                  } catch (Exception e) {
                      js("window.onGh(" + jid + ",0," + JSONObject.quote("{\"message\":" + JSONObject.quote("нет связи: " + e.getMessage()) + "}") + ")");
                  }
              }

              private boolean canInstall() {
                  return Build.VERSION.SDK_INT < 26 || getPackageManager().canRequestPackageInstalls();
              }

              private void installApk(File f) {
                  if (!canInstall()) {
                      pendingApk = f;
                      Toast.makeText(this, "Разреши установку из этого приложения и вернись назад", Toast.LENGTH_LONG).show();
                      startActivity(new Intent(Settings.ACTION_MANAGE_UNKNOWN_APP_SOURCES, Uri.parse("package:" + getPackageName())));
                      return;
                  }
                  try {
                      Uri uri = FileProvider.getUriForFile(this, getPackageName() + ".fileprovider", f);
                      Intent i = new Intent(Intent.ACTION_VIEW);
                      i.setDataAndType(uri, "application/vnd.android.package-archive");
                      i.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION | Intent.FLAG_ACTIVITY_NEW_TASK);
                      startActivity(i);
                  } catch (Exception e) {
                      Toast.makeText(this, "Не удалось открыть установщик: " + e, Toast.LENGTH_LONG).show();
                  }
              }

              // ---------------- сеть ----------------
              private static final Pattern GH = Pattern.compile("^https?://github\\.com/([^/\\s]+)/([^/\\s#?]+)(/releases(/latest)?)?/?$");

              private HttpURLConnection open(String url, String accept, String token) throws Exception {
                  String cur = url;
                  boolean keepAuth = token != null && !token.isEmpty();
                  for (int i = 0; i < 6; i++) {
                      URL u = new URL(cur);
                      HttpURLConnection c = (HttpURLConnection) u.openConnection();
                      c.setInstanceFollowRedirects(false);
                      c.setConnectTimeout(15000);
                      c.setReadTimeout(30000);
                      c.setRequestProperty("User-Agent", "MyGamesLauncher");
                      if (accept != null && !accept.isEmpty()) c.setRequestProperty("Accept", accept);
                      String host = u.getHost();
                      if (keepAuth && (host.equals("api.github.com") || host.equals("github.com"))) {
                          c.setRequestProperty("Authorization", "Bearer " + token);
                      }
                      int code = c.getResponseCode();
                      if (code >= 300 && code < 400 && c.getHeaderField("Location") != null) {
                          cur = new URL(u, c.getHeaderField("Location")).toString();
                          c.disconnect();
                          keepAuth = false;       // на другой хост токен не отправляем
                          accept = null;
                          continue;
                      }
                      if (code == 404) throw new Exception("не найдено (404). Если репозиторий приватный, укажи GitHub-токен в настройках");
                      if (code == 401 || code == 403) throw new Exception("нет доступа (" + code + "). Проверь токен или лимит запросов GitHub");
                      if (code != 200) throw new Exception("HTTP " + code);
                      return c;
                  }
                  throw new Exception("слишком много перенаправлений");
              }

              private String httpText(String url, String token) throws Exception {
                  HttpURLConnection c = open(url, "application/vnd.github+json", token);
                  InputStream in = c.getInputStream();
                  ByteArrayOutputStream bo = new ByteArrayOutputStream();
                  byte[] buf = new byte[8192];
                  int n;
                  long total = 0;
                  while ((n = in.read(buf)) > 0) {
                      bo.write(buf, 0, n);
                      total += n;
                      if (total > 3_000_000) throw new Exception("ответ слишком большой");
                  }
                  in.close();
                  return bo.toString("UTF-8");
              }

              // Возвращает {адрес, Accept, "1" если слать токен}. Для репозитория GitHub: сначала APK из последнего релиза,
              // если релизов нет - APK из последней успешной сборки (Actions, артефакт). Артефакты GitHub отдаёт только с токеном.
              private String[] resolveApk(String url, String token) throws Exception {
                  Matcher m = GH.matcher(url.trim());
                  if (!m.find()) return new String[]{url.trim(), "", "0"};
                  String owner = m.group(1), repo = m.group(2);
                  boolean hasToken = token != null && !token.isEmpty();
                  String relErr;
                  try {
                      JSONObject rel = new JSONObject(httpText("https://api.github.com/repos/" + owner + "/" + repo + "/releases/latest", token));
                      JSONArray assets = rel.optJSONArray("assets");
                      relErr = "в последнем релизе нет файла .apk";
                      if (assets != null) {
                          for (int i = 0; i < assets.length(); i++) {
                              JSONObject a = assets.getJSONObject(i);
                              if (a.optString("name").toLowerCase().endsWith(".apk")) {
                                  if (hasToken) return new String[]{a.getString("url"), "application/octet-stream", "1"};
                                  return new String[]{a.getString("browser_download_url"), "", "0"};
                              }
                          }
                      }
                  } catch (Exception e) {
                      relErr = String.valueOf(e.getMessage());
                  }
                  if (!hasToken) {
                      throw new Exception("релиза с APK нет (" + relErr + "). Укажи GitHub-токен в настройках: тогда приложение возьмёт APK из последней сборки (Actions)");
                  }
                  JSONObject list = new JSONObject(httpText("https://api.github.com/repos/" + owner + "/" + repo + "/actions/artifacts?per_page=40", token));
                  JSONArray arts = list.optJSONArray("artifacts");
                  JSONObject pick = null;
                  if (arts != null) {
                      for (int pass = 0; pass < 2 && pick == null; pass++) {
                          for (int i = 0; i < arts.length(); i++) {
                              JSONObject a = arts.getJSONObject(i);
                              if (a.optBoolean("expired")) continue;
                              boolean apkName = a.optString("name").toLowerCase().contains("apk");
                              if (pass == 0 && !apkName) continue;
                              pick = a;
                              break;
                          }
                      }
                  }
                  if (pick == null) throw new Exception("нет релиза с APK и нет свежих сборок в репозитории " + owner + "/" + repo + " (" + relErr + ")");
                  return new String[]{pick.getString("archive_download_url"), "", "1"};
              }

              // если скачали архив сборки (zip с .apk внутри), достаём из него сам APK
              private void unwrapApk(File out) throws Exception {
                  ZipFile zf = null;
                  try {
                      zf = new ZipFile(out);
                  } catch (Exception e) {
                      return;                       // не zip - дальше проверим как APK
                  }
                  try {
                      if (zf.getEntry("AndroidManifest.xml") != null) return;   // это уже APK
                      ZipEntry found = null;
                      Enumeration<? extends ZipEntry> en = zf.entries();
                      while (en.hasMoreElements()) {
                          ZipEntry e = en.nextElement();
                          if (!e.isDirectory() && e.getName().toLowerCase().endsWith(".apk")) { found = e; break; }
                      }
                      if (found == null) throw new Exception("в архиве сборки нет файла .apk");
                      File tmp = new File(out.getParentFile(), out.getName() + ".x");
                      InputStream in = zf.getInputStream(found);
                      FileOutputStream fo = new FileOutputStream(tmp);
                      byte[] buf = new byte[65536];
                      int n;
                      while ((n = in.read(buf)) > 0) fo.write(buf, 0, n);
                      fo.close();
                      in.close();
                      zf.close();
                      zf = null;
                      out.delete();
                      tmp.renameTo(out);
                  } finally {
                      if (zf != null) try { zf.close(); } catch (Exception ignored) { }
                  }
              }

              // ---------------- мост для страницы ----------------
              public class Bridge {
                  @JavascriptInterface
                  public String info(String pkg) {
                      if (pkg == null || pkg.isEmpty()) return "{\"installed\":false}";
                      try {
                          PackageInfo p = getPackageManager().getPackageInfo(pkg, 0);
                          JSONObject o = new JSONObject();
                          o.put("installed", true);
                          o.put("version", p.versionName == null ? "" : p.versionName);
                          return o.toString();
                      } catch (Exception e) {
                          return "{\"installed\":false}";
                      }
                  }

                  @JavascriptInterface
                  public boolean launch(String pkg) {
                      try {
                          Intent it = getPackageManager().getLaunchIntentForPackage(pkg);
                          if (it == null) return false;
                          it.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                          startActivity(it);
                          return true;
                      } catch (Exception e) {
                          return false;
                      }
                  }

                  @JavascriptInterface
                  public void uninstall(final String pkg) {
                      runOnUiThread(() -> startActivity(new Intent(Intent.ACTION_DELETE, Uri.parse("package:" + pkg))));
                  }

                  @JavascriptInterface
                  public void openUrl(final String url) {
                      runOnUiThread(() -> {
                          try {
                              startActivity(new Intent(Intent.ACTION_VIEW, Uri.parse(url)));
                          } catch (Exception e) {
                              Toast.makeText(MainActivity.this, "Не удалось открыть ссылку", Toast.LENGTH_SHORT).show();
                          }
                      });
                  }

                  @JavascriptInterface
                  public void copy(final String text) {
                      runOnUiThread(() -> {
                          ClipboardManager cm = (ClipboardManager) getSystemService(Context.CLIPBOARD_SERVICE);
                          cm.setPrimaryClip(ClipData.newPlainText("text", text));
                      });
                  }

                  @JavascriptInterface
                  public void pickFile(final String id) {
                      runOnUiThread(() -> {
                          pickId = id;
                          Intent it = new Intent(Intent.ACTION_GET_CONTENT);
                          it.setType("*/*");
                          it.addCategory(Intent.CATEGORY_OPENABLE);
                          try { startActivityForResult(Intent.createChooser(it, "Файл игры"), PICK_REQ); }
                          catch (Exception e) { pickId = null; js("window.onPicked(" + JSONObject.quote(id) + ",\"\",-1)"); }
                      });
                  }

                  @JavascriptInterface
                  public void gh(final String id, final String method, final String url, final String body, final String token) {
                      new Thread(() -> ghCall(id, method, url, body, token)).start();
                  }

                  @JavascriptInterface
                  public void ghPutPicked(final String id, final String url, final String token, final String message, final String sha) {
                      new Thread(() -> {
                          try {
                              if (pickedBytes == null) throw new Exception("файл не выбран");
                              JSONObject o = new JSONObject();
                              o.put("message", message);
                              o.put("content", android.util.Base64.encodeToString(pickedBytes, android.util.Base64.NO_WRAP));
                              if (sha != null && !sha.isEmpty()) o.put("sha", sha);
                              ghCall(id, "PUT", url, o.toString(), token);
                          } catch (Exception e) {
                              js("window.onGh(" + JSONObject.quote(id) + ",0," + JSONObject.quote("{\"message\":" + JSONObject.quote(e.getMessage()) + "}") + ")");
                          }
                      }).start();
                  }

                  @JavascriptInterface
                  public void download(final String id, final String url, final String token) {
                      new Thread(() -> doDownload(id, url, token)).start();
                  }
              }

              private void doDownload(String id, String url, String token) {
                  final String jid = JSONObject.quote(id);
                  try {
                      js("window.onDl(" + jid + ",-1," + JSONObject.quote("Ищем файл…") + ")");
                      String[] r = resolveApk(url, token);
                      File dir = new File(getExternalFilesDir(null), "apk");
                      dir.mkdirs();
                      File out = new File(dir, id.replaceAll("[^A-Za-z0-9_]", "_") + ".apk");
                      HttpURLConnection c = open(r[0], r[1], "1".equals(r[2]) ? token : "");
                      long total = c.getContentLength();
                      InputStream in = c.getInputStream();
                      FileOutputStream fo = new FileOutputStream(out);
                      byte[] buf = new byte[65536];
                      long done = 0;
                      int n, last = -1;
                      while ((n = in.read(buf)) > 0) {
                          fo.write(buf, 0, n);
                          done += n;
                          if (total > 0) {
                              int pct = (int) (done * 100 / total);
                              if (pct != last) {
                                  last = pct;
                                  js("window.onDl(" + jid + "," + pct + "," + JSONObject.quote("Загрузка…") + ")");
                              }
                          }
                      }
                      fo.close();
                      in.close();
                      unwrapApk(out);
                      PackageInfo pi = getPackageManager().getPackageArchiveInfo(out.getAbsolutePath(), 0);
                      if (pi == null) {
                          out.delete();
                          throw new Exception("скачанный файл не похож на APK (для приватного репозитория нужен токен с правами на содержимое и Actions)");
                      }
                      final File apk = out;
                      js("window.onDlDone(" + jid + ",true," + JSONObject.quote("Установка запущена") + "," + JSONObject.quote(pi.packageName) + ")");
                      runOnUiThread(() -> installApk(apk));
                  } catch (Exception e) {
                      js("window.onDlDone(" + jid + ",false," + JSONObject.quote("Ошибка загрузки: " + e.getMessage()) + ",\"\")");
                  }
              }
          }

          JAVA_EOF

      - name: Build APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Prepare file name
        run: cp app/build/outputs/apk/debug/app-debug.apk MoiSteam.apk

      - uses: actions/upload-artifact@v4
        with:
          name: moi-steam-apk
          path: MoiSteam.apk

      - name: Publish release (APK for download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: launcher-${{ github.run_number }}
          name: Игротека (сборка ${{ github.run_number }})
          files: MoiSteam.apk
