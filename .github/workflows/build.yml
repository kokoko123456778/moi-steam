          function ghErr(r){ var m = r.json && r.json.message ? r.json.message : ("HTTP " + r.code); if (/not accessible|Resource not accessible|403/.test(m) || r.code === 403) m += ". У токена не хватает прав: нужны Administration, Contents и Workflows (Read and write) для всех репозиториев"; if (r.code === 401) m = "Токен не подходит (401). Проверь его в настройках"; return m; }
          async function createGameFromFile(){
            if (ng.busy) return;
            var t = ghToken(); if (!t.token) { toast("Сначала укажи GitHub-токен во вкладке «Лаунчер»"); return; }
            var name = ($("ngName").value || "").trim() || niceName(ng.file), orient = $("ngOrient").value, kind = ng.kind;
            ng.busy = true; ng.log = []; render();
            try {
              var owner = t.login;
              var me = await gh("GET", "/user", null, t.token);
              if (me.code !== 200) throw new Error(ghErr(me));
              owner = me.json.login; ngLog("Вход в GitHub: " + owner);
              var base = slugify(name), repo = base;
              for (var n = 2; n < 20; n++) { var ex = await gh("GET", "/repos/" + owner + "/" + repo, null, t.token); if (ex.code === 404) break; repo = base + "-" + n; }
              var cr = await gh("POST", "/user/repos", { name: repo, description: name + " (создано в Игротеке)", auto_init: true, "private": false }, t.token);
              if (cr.code !== 201) throw new Error("не удалось создать репозиторий: " + ghErr(cr));
              ngLog("Репозиторий создан: " + owner + "/" + repo);
