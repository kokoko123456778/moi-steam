            h += '</div><div><div class="hero"><div class="art">'+artSVG(g.art)+'<div class="ttl">'+esc(g.name)+'</div></div><div class="info">';
            h += '<div class="tags">'+g.tags.map(function(t){return '<span class="tag">'+esc(t)+'</span>';}).join("")+'</div>';
            h += '<div class="meta"><span>Версия: '+esc(g.version)+'</span><span>Размер: '+esc(g.size)+'</span><span>'+esc(g.price)+'</span></div>';
            h += '<div class="plat">'+g.platforms.map(function(p){return '<i>'+esc(p)+'</i>';}).join("")+'</div><div class="actions">';
            var first = true;
            if (NATIVE) { h += nativeButtons(g); }
            else for (var t = 0; t < LINK_TYPES.length; t++) {
              var key = LINK_TYPES[t][0], v = getLink(g, key);
              if (key === "source") continue;
              if (isUrl(v)) { h += '<a class="btn'+(first?" play":"")+'" href="'+esc(v)+'" target="_blank" rel="noopener">'+(first?"▶ ":"")+esc(LINK_TYPES[t][1])+'</a>'; first = false; }
              else h += '<button class="btn off" data-need="'+key+'">'+esc(LINK_TYPES[t][1])+' · нет ссылки</button>';
            }
            h += '</div>';
            if (NATIVE) h += otherLinks(g);
            h += '</div></div>';
            h += '<div class="sub">'+[["desc","Описание"],["inst","Установка"],["news","Что нового"]].map(function(x){return '<button data-s="'+x[0]+'" class="'+(subTab===x[0]?"on":"")+'">'+x[1]+'</button>';}).join("")+'</div><div class="sec">';
            if (subTab === "desc") {
              h += '<p>'+esc(g.desc)+'</p><div class="box"><h4>Особенности</h4><ul>'+g.features.map(function(f){return '<li>'+esc(f)+'</li>';}).join("")+'</ul></div><div class="box"><h4>Системные требования</h4><ul>'+g.req.map(function(f){return '<li>'+esc(f)+'</li>';}).join("")+'</ul></div>';
            } else if (subTab === "inst") {
