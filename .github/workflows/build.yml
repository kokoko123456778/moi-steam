          function setToken(v){ try { localStorage.setItem(TOKEN_KEY, v.trim()); } catch (e) {} }
          function makeCustom(c){
            return { id:c.id, name:c.name, art:"generic", color:"#7a5cd1", short:"Моя игра", tags:["Моя игра"], platforms:["Android"], version:"-", size:"-", price:"Бесплатно", pkg:c.pkg||"",
              desc:"Игра добавлена вручную. Укажи ссылку на APK (файл или GitHub-репозиторий с релизом) в разделе «Ссылки».", features:["Скачивание и установка прямо из приложения"], req:["Android"], howto:[["Установка","Нажми «Скачать и установить» и разреши установку из этого приложения."]], news:["Добавлена вручную"],
              links:{web:"", itch:"", apk:c.apk||"", win:"", repo:"", source:""}, notes:{}, custom:true };
          }
          (function loadCustomGames(){ var arr = []; try { arr = JSON.parse(localStorage.getItem(CUSTOM_KEY) || "[]"); } catch (e) { arr = []; } for (var i = 0; i < arr.length; i++) GAMES.push(makeCustom(arr[i])); })();
          function saveCustom(){ var arr = []; for (var i = 0; i < GAMES.length; i++) if (GAMES[i].custom) arr.push({ id:GAMES[i].id, name:GAMES[i].name, apk:getLink(GAMES[i],"apk"), pkg:getPkg(GAMES[i]) }); try { localStorage.setItem(CUSTOM_KEY, JSON.stringify(arr)); } catch (e) {} }
          function addCustomGame(name, apk, pkg){ var g = makeCustom({ id:"c" + Date.now(), name:name, apk:apk, pkg:pkg }); GAMES.push(g); saveCustom(); return g; }
          function removeCustomGame(id){ for (var i = 0; i < GAMES.length; i++) if (GAMES[i].id === id && GAMES[i].custom) { GAMES.splice(i, 1); break; } saveCustom(); }

          /* ====================== ХУДОЖЕСТВО ====================== */
          function artSVG(kind, w, h){
            var s = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" preserveAspectRatio="xMidYMid slice" width="100%" height="100%">';
            if (kind === "blocks") {
